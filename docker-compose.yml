version: "3.9"
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: agriflow
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
  api:
    image: mcr.microsoft.com/devcontainers/javascript-node:20
    user: node
    working_dir: /workspaces/agriflow
    command: sleep infinity
    volumes:
      - ./:/workspaces/agriflow:cached
    depends_on:
      - db
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/agriflow
volumes:
  db_data:
